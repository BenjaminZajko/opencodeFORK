name: OliveCode computer use on Windows and Linux

on:
  push:
    branches: ['codex/release-*', 'desktop-os-check']
    paths:
      - 'packages/opencode/src/computer/**'
      - 'packages/opencode/src/tool/desktop.ts'
      - 'packages/opencode/src/tool/browser.ts'
      - 'packages/opencode/script/desktop-os-check.ts'
      - '.github/workflows/olivecode-desktop-os.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Diagnose Notepad's accessibility tree
        timeout-minutes: 3
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Start-Process notepad.exe; Start-Sleep 3
          $p = Get-Process notepad | Select-Object -First 1
          "process: $($p.ProcessName) $($p.Id) handle: $($p.MainWindowHandle) title: $($p.MainWindowTitle)"
          $root = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
          function Dump($e, $d) {
            if ($d -gt 6) { return }
            $c = $e.Current
            ('  ' * $d) + "$($c.ControlType.ProgrammaticName) name='$($c.Name)' class=$($c.ClassName) offscreen=$($c.IsOffscreen) focusable=$($c.IsKeyboardFocusable) rect=$($c.BoundingRectangle)"
            $child = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetFirstChild($e)
            $n = 0
            while ($child -and $n -lt 40) { Dump $child ($d + 1); $child = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetNextSibling($child); $n++ }
          }
          Dump $root 0
          "foreground: $([System.Windows.Automation.AutomationElement]::FocusedElement.Current.ControlType.ProgrammaticName)"
          Stop-Process -Name notepad -Force
      - name: Desktop adapter drives a real Notepad
        timeout-minutes: 10
        working-directory: packages/opencode
        run: bun script/desktop-os-check.ts notepad
      - name: Browser control with the installed Chrome/Edge
        working-directory: packages/opencode
        run: bun test test/computer/browser.test.ts --timeout 60000

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Install a desktop session for the check
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get install -y --no-install-recommends xvfb openbox dbus-x11 at-spi2-core python3-pyatspi python3-gi gir1.2-gtk-3.0 xdotool mousepad libglib2.0-bin && break
            sleep 20
          done
      - name: Desktop adapter drives a real Mousepad
        timeout-minutes: 10
        working-directory: packages/opencode
        run: |
          cat > "$RUNNER_TEMP/session.sh" <<'EOF'
          set -e
          export XDG_SESSION_TYPE=x11 GTK_MODULES=gail:atk-bridge NO_AT_BRIDGE=0
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 1
          openbox &
          sleep 1
          bun script/desktop-os-check.ts mousepad
          EOF
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" bash "$RUNNER_TEMP/session.sh"
