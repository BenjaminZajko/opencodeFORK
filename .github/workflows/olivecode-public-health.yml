name: OliveCode public download health

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - distribution/public-health.mjs
      - distribution/test/public-health.test.js
      - .github/workflows/olivecode-public-health.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: olivecode-public-health
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'BenjaminZajko/opencodeFORK'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify health-check failure cases
        working-directory: distribution
        run: bun test ./test/public-health.test.js
      - name: Check public release and live installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun distribution/public-health.mjs > public-download-health.json
      - name: Show checked release
        run: cat public-download-health.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-download-health
          path: public-download-health.json
          retention-days: 14
          if-no-files-found: error
