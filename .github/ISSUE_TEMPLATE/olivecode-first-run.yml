name: OliveCode first-run feedback
description: Tell us how your first installation or small coding task went.
title: "[First run]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying OliveCode. Successful results and failures are both useful.
        This is a public report: use a small example and remove tokens, private code and personal information.
  - type: dropdown
    id: outcome
    attributes:
      label: How did it go?
      options:
        - Installed and completed a small task
        - Installation did not work
        - Model connection or download did not work
        - Task was incomplete or incorrect
        - Something else
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "For example: Windows 11 x64, macOS Apple Silicon, or Ubuntu x64"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OliveCode version
      description: "Run olivecode --version if available. Otherwise write not installed."
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Selected model and provider
      description: "For example: local Ollama model name, or cloud provider and model. Never paste an API key."
    validations:
      required: false
  - type: textarea
    id: result
    attributes:
      label: What did you try, and what happened?
      placeholder: |
        Task or installation step:
        Expected result:
        Actual result:
        Did the changed files and checks match the final answer?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional redacted error or test output
      description: "A short relevant excerpt is enough. Avoid full private conversations, access tokens, bot credentials or private project files."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before publishing
      options:
        - label: "I have removed secrets, private code and personal information from this public report."
          required: true
